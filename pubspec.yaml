name: savedex
description: "A new Flutter project."

publish_to: 'none' 


version: 0.1.0+1

environment:
  sdk: ^3.13.1


dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.2
  path: ^1.9.1
  file_picker: ^13.3.3
  csv: ^8.0.0
  archive: ^4.5.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  extended_image: ^10.1.0
  dynamic_color: ^2.1.0
  intl: ^0.20.3
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  gal: ^3.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_foreground_task: ^11.0.3
  package_info_plus: ^10.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true

  assets:
    - assets/icons/


flutter_launcher_icons:
  image_path: ".github/assets/savedex_icon.png"
  android: true

  ios: true
  image_path_ios: ".github/assets/savedex_icon_fill.png"
  remove_alpha_ios: true

  min_sdk_android: 21
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: ".github/assets/savedex_icon.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: ".github/assets/savedex_icon_monochrome.png"

  windows:
    generate: true
    image_path: ".github/assets/savedex_icon_fill.png"
    icon_size: 256
  macos:
    generate: true
    image_path: ".github/assets/savedex_icon_fill.png"
  linux:
    generate: true
    image_path: ".github/assets/savedex_icon_fill.png"